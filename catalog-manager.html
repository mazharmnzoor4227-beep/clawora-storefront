<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clawora Catalog Manager</title><link rel="stylesheet" href="styles.css"><style>
.manager{max-width:900px;margin:30px auto;padding:0 14px}.box{background:#fffdfa;border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form textarea{border:1px solid var(--line);border-radius:12px;padding:11px}.form textarea{grid-column:1/-1;min-height:90px}.rows{display:grid;gap:8px}.r{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px}.r img{width:60px;height:60px;object-fit:contain;background:#fff;border-radius:9px}.r b{font-size:11px}.r span{font-size:10px;color:var(--muted)}@media(max-width:600px){.form{grid-template-columns:1fr}.r{grid-template-columns:50px 1fr}.r>div:last-child{grid-column:1/-1}}
</style></head><body><div class="manager"><a href="index.html">← Back to Store</a>
<div class="box"><h1 style="font-family:Georgia,serif;font-weight:400">Catalog Manager</h1><p style="color:var(--muted);font-size:12px">Add, edit or delete products here. Then download the updated <b>products.json</b> and replace the old file in GitHub. No coding required.</p></div>
<div class="box form"><input id="title" placeholder="Product title"><input id="vendor" placeholder="Brand / vendor"><input id="type" placeholder="Category"><input id="price" type="number" placeholder="Price PKR"><input id="stock" type="number" placeholder="Stock"><input id="image" placeholder="Image URL"><textarea id="description" placeholder="Description"></textarea><button class="btn" style="background:#171216;color:white" onclick="saveProduct()">Add / Save Product</button><button class="btn" onclick="downloadJson()">Download products.json</button></div>
<div class="box"><div id="rows" class="rows"></div></div></div><script>
let data=[],editId=null;
async function init(){data=await fetch('products.json').then(r=>r.json());render()}
function render(){rows.innerHTML=data.map(p=>`<div class="r"><img src="${p.image}"><div><b>${p.title}</b><span>${p.vendor} • PKR ${p.price} • Stock ${p.stock}</span></div><div><button onclick="edit(${p.id})">Edit</button> <button onclick="del(${p.id})">Delete</button></div></div>`).join('')}
function saveProduct(){const obj={title:title.value.trim(),vendor:vendor.value.trim(),type:type.value.trim(),price:+price.value||0,stock:+stock.value||0,image:image.value.trim(),description:description.value.trim()};if(!obj.title)return alert('Product title required');if(editId){Object.assign(data.find(x=>x.id===editId),obj)}else{obj.id=Math.max(0,...data.map(x=>x.id))+1;data.push(obj)}editId=null;['title','vendor','type','price','stock','image','description'].forEach(id=>document.getElementById(id).value='');render()}
function edit(id){const p=data.find(x=>x.id===id);editId=id;for(const k of ['title','vendor','type','price','stock','image','description'])document.getElementById(k).value=p[k]??'';scrollTo({top:0,behavior:'smooth'})}
function del(id){if(confirm('Delete this product?')){data=data.filter(x=>x.id!==id);render()}}
function downloadJson(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='products.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
init();
</script></body></html>
